<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="100%" height="100%" role="img" aria-label="SalesGency Brand Icon">
  <defs>
    <linearGradient id="sg-ico-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C2FF" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="sg-ico-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Hex Shield / Node Core -->
  <polygon points="20,3 35,11.5 35,28.5 20,37 5,28.5 5,11.5" fill="none" stroke="url(#sg-ico-grad)" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Internal Converging GTM Vectors -->
  <path d="M20,3 L20,20 L35,28.5" fill="none" stroke="url(#sg-ico-grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M5,11.5 L20,20 L5,28.5" fill="none" stroke="url(#sg-ico-grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Central Pulse Nucleus -->
  <circle cx="20" cy="20" r="3" fill="#00C2FF" filter="url(#sg-ico-glow)"/>
  <!-- Satellite Active Nodes -->
  <circle cx="20" cy="3" r="1.8" fill="#00C2FF"/>
  <circle cx="35" cy="11.5" r="1.8" fill="#7C3AED"/>
  <circle cx="35" cy="28.5" r="1.8" fill="#7C3AED"/>
  <circle cx="20" cy="37" r="1.8" fill="#00C2FF"/>
  <circle cx="5" cy="28.5" r="1.8" fill="#00C2FF"/>
  <circle cx="5" cy="11.5" r="1.8" fill="#00C2FF"/>
</svg>
