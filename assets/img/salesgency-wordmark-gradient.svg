<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 50" width="280" height="50" role="img" aria-label="SalesGency">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');
      .sg-base-light {
        font-family: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.028em;
      }
      .sg-navy-text { fill: #0F2A4A; }
      .sg-grad-text { fill: url(#sg-brand-grad-light); }
      .sg-dot-light { fill: #1F6FEB; }
    </style>
    <linearGradient id="sg-brand-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F6FEB" />
      <stop offset="100%" stop-color="#0F2A4A" />
    </linearGradient>
  </defs>

  <!-- SalesGency Wordmark (Navy two-tone on Light/White) — v2 site -->
  <g transform="translate(6, 36)">
    <text class="sg-base-light">
      <tspan class="sg-navy-text">Sales</tspan><tspan class="sg-grad-text">Gency</tspan><tspan class="sg-dot-light" dx="2">.</tspan>
    </text>
  </g>
</svg>
