<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 40" width="100%" height="100%" role="img" aria-label="SalesGency Brand Logo">
  <defs>
    <linearGradient id="sg-logo-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem (32x32 centered vertically) -->
  <g transform="translate(2, 4)">
    <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="#F8FAFC" stroke="url(#sg-logo-grad-light)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M16,2 L16,16 L28,23" fill="none" stroke="url(#sg-logo-grad-light)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4,9 L16,16 L4,23" fill="none" stroke="url(#sg-logo-grad-light)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="16" cy="16" r="2.8" fill="#0284C7"/>
    <circle cx="16" cy="2" r="1.4" fill="#0284C7"/>
    <circle cx="28" cy="9" r="1.4" fill="#7C3AED"/>
    <circle cx="28" cy="23" r="1.4" fill="#7C3AED"/>
    <circle cx="16" cy="30" r="1.4" fill="#0284C7"/>
    <circle cx="4" cy="23" r="1.4" fill="#0284C7"/>
    <circle cx="4" cy="9" r="1.4" fill="#0284C7"/>
  </g>

  <!-- Brand Typography (Geist / Outfit with fallback) -->
  <g transform="translate(42, 28)">
    <text font-family="'Geist', 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.03em">
      <tspan fill="#0F172A">Sales</tspan><tspan fill="url(#sg-logo-grad-light)">Gency</tspan><tspan fill="#0284C7" dx="1">.</tspan>
    </text>
  </g>
</svg>
